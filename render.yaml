# Render Blueprint for the backend API (the frontend is deployed separately on Vercel).
# Builds the repo's Dockerfile, which also generates the sample database at build time.
services:
  - type: web
    name: sql-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # the Vercel production URL, e.g. https://sql-agent.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_CORE
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-3.8-flash
