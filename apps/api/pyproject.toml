[project]
name = "sql-agent-api"
version = "0.1.0"
description = "Schema-grounded, read-only natural-language to SQL agent (API)"
requires-python = ">=3.12,<3.13"
# Bounds are compatible-release: floor = the tested version (also pinned exactly in uv.lock),
# ceiling = the next major, so a relock can't silently pull a breaking major of the
# fast-moving LLM/parser stack.
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "langgraph>=1.2,<2.0",
    "langchain-core>=1.7,<2.0",
    "langchain-google-genai>=4.4,<5.0",
    "sqlglot>=30.24,<31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "langchain_google_genai.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
